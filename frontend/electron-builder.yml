# electron-builder configuration for PromptGuard.
#
# The `build` key in package.json is already taken by an npm script, so
# electron-builder is configured from this file instead.
#
# The Node/Fastify backend is shipped as an unpacked resource
# (resources/backend/dist + its node_modules) and launched at runtime by
# frontend/electron/backendProcess.ts using Electron's bundled Node
# (ELECTRON_RUN_AS_NODE) — the installed app needs no system Node, Python,
# pip, FastAPI, Uvicorn, Playwright or scikit-learn.
#
# Run with:  npm run package        (full NSIS installer)
#            npm run package:dir    (unpacked app dir, for smoke testing)
#
# NOTE: `npm run build` compiles backend-node with its full dependency tree
# (tsx / vitest / esbuild are devDependencies). For a lean installer, run
# `npm ci --omit=dev` inside ../backend-node before `npm run package` so only
# fastify/pino/cheerio/@sinclair/typebox/dotenv are copied.

appId: com.promptguard.browser
productName: PromptGuard

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

extraResources:
  - from: ../backend-node/dist
    to: backend/dist
  - from: ../backend-node/node_modules
    to: backend/node_modules
  - from: ../backend-node/package.json
    to: backend/package.json

asar: true

win:
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
